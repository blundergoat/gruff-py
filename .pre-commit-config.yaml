repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        # ruff-format also formats Python blocks inside Markdown; keep it off the docs and ADR pseudo-code.
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        additional_dependencies: ["click>=8.1", "docstring-parser>=0.15,<1", "pathspec>=0.12", "types-PyYAML>=6.0"]
        args: ["--config-file=pyproject.toml"]
        files: ^src/
